    "commandId": "probe.run",
    "scenarioId": "auth.fresh-process",
    "owner": "hermes",
    "firstRelease": "R0",
    "kind": "behavioral",
    "mandatoryCases": [
      {
        "id": "add",
        "publicOperation": "hermes --profile toy auth add openai-codex --type oauth --no-browser",
        "phase": "add"
      },
      {
        "id": "list",
        "publicOperation": "hermes --profile toy auth list openai-codex",
        "phase": "list"
      },
      {
        "id": "chat",
        "publicOperation": "hermes --profile toy chat --provider openai-codex --model gpt-6.1-sol --toolsets none -q \"Return the fixed fixture marker.\"",
        "phase": "chat"
      },
      {
        "id": "chat-expired",
        "publicOperation": "hermes --profile toy chat --provider openai-codex --model gpt-6.1-sol --toolsets none -q \"Return the fixed fixture marker.\"",
        "phase": "chat-expired"
      },
      {
        "id": "chat-reloaded",
        "publicOperation": "hermes --profile toy chat --provider openai-codex --model gpt-6.1-sol --toolsets none -q \"Return the fixed fixture marker.\"",
        "phase": "chat-reloaded"
      }
    ],
    "trigger": "Save a fresh synthetic Codex profile grant with real auth-add, terminate that process, use it in a fresh chat process, expire the fake access token, then refresh and use the newest grant in another fresh process.",
